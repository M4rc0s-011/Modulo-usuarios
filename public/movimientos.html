<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movimientos · Sistema de Gestión de Inventario</title>
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
  <header>
    <h1>Sistema de Gestión de Inventario · Movimientos de inventario</h1>
    <span id="sesion">Sesión no iniciada</span>
  </header>
  <nav id="menu"></nav>

  <main>
    <section>
      <h2>Registrar movimiento</h2>
      <div id="mensaje" role="status" aria-live="polite"></div>

      <label for="productoId">Producto</label>
      <select id="productoId"><option value="">Cargando…</option></select>
      <p class="ayuda" id="infoStock">Seleccione un producto para ver su existencia.</p>

      <label for="tipo">Tipo de movimiento</label>
      <select id="tipo"></select>

      <label for="cantidad">Cantidad</label>
      <input id="cantidad" type="number" min="1" step="1" value="1" />

      <label for="motivo">Motivo (opcional)</label>
      <input id="motivo" type="text" maxlength="255" placeholder="Ej.: Compra a proveedor, despacho a producción" />

      <button id="btnRegistrar" type="button">Registrar</button>
    </section>

    <section>
      <h2>Historial reciente</h2>
      <table>
        <thead>
          <tr><th>Fecha</th><th>Producto</th><th>Tipo</th><th>Cant.</th><th>Stock final</th><th>Usuario</th></tr>
        </thead>
        <tbody id="tablaMovimientos"><tr><td colspan="6" class="vacio">Cargando…</td></tr></tbody>
      </table>
    </section>
  </main>

  <script src="js/comun.js"></script>
  <script src="js/movimientos.js"></script>
</body>
</html>
