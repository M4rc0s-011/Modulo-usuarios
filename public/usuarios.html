<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Usuarios · Sistema de Gestión de Inventario</title>
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
  <header>
    <h1>Sistema de Gestión de Inventario · Administración de usuarios</h1>
    <span id="sesion">Sesión no iniciada</span>
  </header>
  <nav id="menu"></nav>

  <main>
    <section>
      <h2>Crear usuario</h2>
      <div id="mensaje" role="status" aria-live="polite"></div>

      <label for="nombre">Nombre completo</label>
      <input id="nombre" type="text" autocomplete="off" placeholder="Ej.: Ana Pérez Reyes" />

      <label for="email">Correo electrónico</label>
      <input id="email" type="email" autocomplete="off" placeholder="ana.perez@empresa.do" />

      <label for="password">Contraseña temporal</label>
      <input id="password" type="password" autocomplete="new-password" />
      <p class="ayuda">Mínimo 8 caracteres, con al menos una mayúscula y un número.</p>

      <label for="rolId">Rol (nivel de privilegio)</label>
      <select id="rolId"><option value="">Cargando roles…</option></select>

      <div id="privilegios">Seleccione un rol para ver los privilegios que otorga.</div>

      <button id="btnCrear" type="button">Crear usuario</button>
    </section>

    <section>
      <h2>Usuarios registrados</h2>
      <table>
        <thead>
          <tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th></tr>
        </thead>
        <tbody id="tablaUsuarios">
          <tr><td colspan="4" class="vacio">Sin datos cargados.</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <script src="js/comun.js"></script>
  <script src="js/usuarios.js"></script>
</body>
</html>
