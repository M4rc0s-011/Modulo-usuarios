<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Productos · Sistema de Gestión de Inventario</title>
  <link rel="stylesheet" href="css/estilos.css" />
  <style>
    /* Formulario en cuadrícula para dejar la tabla a ancho completo */
    .form-grid { display: grid; gap: 0 1rem; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
    .form-grid button { align-self: end; margin-bottom: .9rem; }
  </style>
</head>
<body>
  <header>
    <h1>Sistema de Gestión de Inventario · Productos</h1>
    <span id="sesion">Sesión no iniciada</span>
  </header>
  <nav id="menu"></nav>

  <main class="ancho">
    <section id="seccionFormulario" class="oculto">
      <h2>Registrar producto</h2>
      <div id="mensaje" role="status" aria-live="polite"></div>

      <div class="form-grid">
        <div><label for="codigo">Código</label>
          <input id="codigo" type="text" placeholder="Ej.: MP-003" maxlength="30" /></div>
        <div><label for="nombre">Nombre</label>
          <input id="nombre" type="text" maxlength="120" /></div>
        <div><label for="categoriaId">Categoría</label>
          <select id="categoriaId"><option value="">Cargando…</option></select></div>
        <div><label for="unidad">Unidad de medida</label>
          <input id="unidad" type="text" value="unidad" maxlength="20" /></div>
        <div><label for="precio">Precio (RD$)</label>
          <input id="precio" type="number" min="0" step="0.01" value="0" /></div>
        <div><label for="stockMinimo">Stock mínimo</label>
          <input id="stockMinimo" type="number" min="0" step="1" value="0" /></div>
        <button id="btnGuardar" type="button">Registrar producto</button>
      </div>
      <p class="ayuda" style="margin-top:0">El stock inicial es 0. Se aumenta registrando un ingreso en Movimientos.</p>
    </section>

    <section id="seccionLista">
      <h2>Catálogo de productos</h2>
      <div class="filtros">
        <input id="buscar" type="search" placeholder="Buscar por código o nombre" />
        <select id="filtroCategoria"><option value="">Todas las categorías</option></select>
        <button id="btnBuscar" type="button">Buscar</button>
      </div>
      <table>
        <thead>
          <tr><th>Código</th><th>Nombre</th><th>Categoría</th><th>Stock</th><th>Mínimo</th><th class="derecha">Precio</th><th></th></tr>
        </thead>
        <tbody id="tablaProductos"><tr><td colspan="7" class="vacio">Cargando…</td></tr></tbody>
      </table>
    </section>
  </main>

  <script src="js/comun.js"></script>
  <script src="js/productos.js"></script>
</body>
</html>
