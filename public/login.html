<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión · Sistema de Gestión de Inventario</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f2f4f7;
           font-family:"Segoe UI",Roboto,system-ui,sans-serif; color:#17202a; }
    .caja { background:#fff; border:1px solid #d8dee5; border-radius:6px; padding:2rem;
            width:min(360px,90vw); }
    h1 { font-size:1rem; margin:0 0 .3rem; }
    p.sub { font-size:.82rem; color:#5b6875; margin:0 0 1.4rem; }
    label { display:block; font-size:.85rem; font-weight:600; margin-bottom:.3rem; }
    input { width:100%; box-sizing:border-box; padding:.55rem .65rem; margin-bottom:1rem;
            border:1px solid #d8dee5; border-radius:4px; font:inherit; font-size:.9rem; }
    input:focus { outline:2px solid #0f5c4c; outline-offset:1px; }
    button { width:100%; padding:.65rem; border:none; border-radius:4px; background:#0f5c4c;
             color:#fff; font:inherit; font-weight:600; cursor:pointer; }
    #error { display:none; font-size:.85rem; color:#a4262c; background:#fbeaea;
             padding:.6rem .8rem; border-radius:4px; margin-bottom:1rem; }
  </style>
</head>
<body>
  <div class="caja">
    <h1>Sistema de Gestión de Inventario</h1>
    <p class="sub">Ingrese sus credenciales para continuar.</p>
    <div id="error" role="alert"></div>
    <label for="email">Correo electrónico</label>
    <input id="email" type="email" autocomplete="username" />
    <label for="password">Contraseña</label>
    <input id="password" type="password" autocomplete="current-password" />
    <button id="btnEntrar" type="button">Iniciar sesión</button>
  </div>
  <script src="js/login.js"></script>
</body>
</html>
